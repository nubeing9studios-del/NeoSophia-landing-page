<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Capture Gateway — Nubeing 9 Studios</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">
  <h1>Signal Capture</h1>
  <p>Turn noise into one clear next move.</p>
</section>

<section class="tool" id="toolSection">

  <h2>Capture your signal</h2>

  <textarea 
    id="signalInput" 
    placeholder="What signal, tension, or question is active right now?"
  ></textarea>

  <div class="tool-actions">
    <button onclick="generateInsight()">Generate Insight</button>
    <button onclick="clearSignal()">Clear Signal</button>
    <button onclick="clearHistory()">Clear History</button>
  </div>

  <div id="output" class="output-card"></div>

  <div id="history"></div>

</section>

<script src="script.js"></script>

</body>
</html>
